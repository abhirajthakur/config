set -g mouse on
set -g escape-time 0
set -g status-interval 3
set-option -g set-clipboard on

# Reload config with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# New window in current working directory
bind c new-window -c "#{pane_current_path}"

# Maximize/restore pane with m
bind -r m resize-pane -Z

# Vi mode for copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Easier pane navigation with vim keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Enable true color
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",*:Tc"

# Status bar
set -g status-position top
set -g status-style "bg=#1e1e2e fg=#cdd6f4"

# Left side (session name)
set -g status-left "#{?client_prefix,#[bg=#f38ba8]#[fg=#1e1e2e] #S ,#[fg=#89b4fa,bold] #S }"
# set -g status-left-length 50

# Window list
set -g window-status-format "#[fg=#a6adc8] #I:#W "
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "

# Right side (date/time)
set -g status-right "#[fg=#94e2d5]%a %d %b #[fg=#f9e2af]%I:%M %p "

# Pane borders
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"

# Messages
set -g message-style "bg=#89b4fa fg=#1e1e2e,bold"
set -g message-command-style "bg=#f38ba8 fg=#1e1e2e,bold"

# Clock mode
set -g clock-mode-colour "#89b4fa"

# Selection color in copy-mode
set -g mode-style "bg=#45475a fg=#cdd6f4"
