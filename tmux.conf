set -g mouse on
set -g escape-time 0
set -g status-interval 3
set-option -g set-clipboard on
set -g xterm-keys on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reload config with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# New window in current working directory
bind c new-window -c "#{pane_current_path}"

# Maximize/restore pane with m
bind -r m resize-pane -Z

# Vi mode for copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Easier pane navigation with vim keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Rename window to dir instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Window swapping
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Status bar
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default'

set -g status-left-style 'fg=#2E3440,bg=#89b4fa,bold'
set -g status-left ' #S '
set -g status-left-length 20
set -g status-right ''

set -g pane-border-lines single
set -g pane-border-style 'fg=#4C566A'
set -g pane-active-border-style 'fg=#89b4fa'

setw -g window-status-separator ''
setw -g window-status-format ' #I:#W #F '
setw -g window-status-style 'bg=default,fg=#D8DEE9'
setw -g window-status-current-format ' #I:#W #F '
setw -g window-status-current-style 'bg=default,fg=#89b4fa,bold'

# Selection color in copy-mode
set -g mode-style "bg=#45475a fg=#cdd6f4"
