# ~/.config/tmux/tmux.conf  (no plugins)
# Colors: Tokyonight "night" palette
#   bg #1a1b26  bg_dark #16161e  bg_hl #292e42  visual #283457
#   fg #c0caf5  comment #565f89  blue #7aa2f7  cyan #7dcfff
#   yellow #e0af68  red #f7768e  orange #ff9e64
# Tip: set your terminal background to #1a1b26 so panes match nvim exactly.

# --- Core -------------------------------------------------------------
set -g escape-time 0
set -g status-interval 3
set -g set-clipboard on
set -g focus-events on            # lets nvim notice focus changes (autoread etc.)
set -g history-limit 50000
set -g mouse on

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- Keys -------------------------------------------------------------
# Reload config with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# New window / splits keep the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"

# Maximize/restore pane with m
bind -r m resize-pane -Z

# Pane navigation with vim keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes with Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window swapping
bind -r Left  swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# Vi mode for copy mode
set-window-option -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar (bottom) ----------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=#16161e,fg=#a9b1d6'

# Session pill: blue normally, yellow while the prefix key is active
set -g status-left-length 30
set -g status-left '#{?client_prefix,#[bg=#e0af68],#[bg=#7aa2f7]}#[fg=#16161e,bold] #S #[default] '

set -g status-right-length 60
set -g status-right '#[fg=#565f89]#{b:pane_current_path}  #[fg=#c0caf5]%a %d %b  #[fg=#7dcfff,bold]%H:%M #[default]'

setw -g window-status-separator ''
setw -g window-status-format ' #I:#W '
setw -g window-status-style 'fg=#565f89'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
setw -g window-status-current-style 'bg=#292e42,fg=#7aa2f7,bold'
setw -g window-status-activity-style 'fg=#e0af68'
setw -g window-status-bell-style 'fg=#f7768e'

# --- Panes, messages, copy mode ---------------------------------------
set -g pane-border-lines single
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#7aa2f7'

set -g message-style 'bg=#292e42,fg=#c0caf5'
set -g message-command-style 'bg=#292e42,fg=#7dcfff'
set -g mode-style 'bg=#283457,fg=#c0caf5'

set -g display-panes-colour '#565f89'
set -g display-panes-active-colour '#ff9e64'
setw -g clock-mode-colour '#7aa2f7'

# Popups / menus (tmux 3.3+ / 3.4+; -q ignores options your version lacks)
set -gq popup-style 'bg=#1a1b26,fg=#c0caf5'
set -gq popup-border-style 'fg=#7aa2f7'
set -gq popup-border-lines rounded
set -gq menu-style 'bg=#1a1b26,fg=#c0caf5'
set -gq menu-selected-style 'bg=#283457,fg=#c0caf5'
set -gq menu-border-style 'fg=#7aa2f7'
