set -g mouse on

set-option -g set-clipboard on
set -g default-terminal "tmux-256color"
set -g escape-time 0
set -g status-interval 3

# Prefix key: change from default C-b to C-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config with Prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes in current working directory
unbind %
bind \ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# New window in current working directory
bind c new-window -c "#{pane_current_path}"

# Maximize/restore pane with m
bind -r m resize-pane -Z

# Vi mode for copy mode
set-window-option -g mode-keys vi

# Easier pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Catppuccin theme settings
set -g @catppuccin_window_status_style "rounded"

# Status bar customization
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g status-position top

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
# Initialize TPM (keep at the end
run '~/.tmux/plugins/tpm/tpm'
